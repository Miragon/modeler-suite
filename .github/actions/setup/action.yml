name: Setup
description: Install Node and restore dependencies with a clean, lockfile-pinned npm install.

inputs:
  node-version:
    description: >-
      Node.js version. Empty picks the floor of the root's engines.node, raised to the modeler's own
      floor when a modeler is given, so CI verifies the declared minimum.
    required: false
    default: ""
  modeler:
    description: The modeler (a folder under modelers/) whose engines.node floor applies as well.
    required: false
    default: ""
  registry-url:
    description: npm registry to configure (the publish jobs set it; CI leaves it empty).
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Before setup-node, so it reads the manifests with whichever Node the runner or the job's
    # container brings.
    - id: node
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
        MODELER: ${{ inputs.modeler }}
      run: |
        set -euo pipefail
        if [[ -n "$NODE_VERSION" ]]; then
          echo "version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        floor() {
          node -p "(require('./$1').engines?.node ?? '').match(/\d+\.\d+\.\d+/)?.[0] ?? ''"
        }
        floors=$(floor package.json)
        if [[ -n "$MODELER" ]]; then floors+=$'\n'$(floor "modelers/$MODELER/package.json"); fi
        version=$(printf '%s\n' "$floors" | sed '/^$/d' | sort -V | tail -n 1)
        if [[ -z "$version" ]]; then
          echo "::error::No engines.node floor in package.json${MODELER:+ or modelers/$MODELER/package.json}"
          exit 1
        fi
        echo "Node $version, the engines floor${MODELER:+ of the suite and $MODELER}"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.node.outputs.version }}
        registry-url: ${{ inputs.registry-url }}
        cache: npm

    - run: npm ci
      shell: bash
