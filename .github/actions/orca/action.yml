name: Orca
description: >-
  Resolve the Orca version of a smoke channel, and download and extract that Orca's AppImage, from
  the cache when it holds it.

inputs:
  channel:
    description: latest (the newest Orca release) or minimum (the floor of engines.orca)
    required: true
  plugin-manifest:
    description: The plugin's orca-plugin.json, whose engines.orca sets the minimum
    required: true

outputs:
  app:
    description: The extracted Orca, to pass as ORCA_APP
    value: ${{ steps.resolve.outputs.app }}

runs:
  using: composite
  steps:
    # The minimum comes from engines.orca at run time, so raising the floor moves the smoke along.
    - id: resolve
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        MANIFEST: ${{ inputs.plugin-manifest }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [[ "$CHANNEL" == minimum ]]; then
          version=$(node -p "require('semver').minVersion(require(process.argv[1]).engines.orca).version" "$(realpath "$MANIFEST")")
        else
          version=$(gh release view --repo stablyai/orca --json tagName --jq '.tagName | ltrimstr("v")')
        fi
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::No Orca version for $CHANNEL: '$version'"
          exit 1
        fi
        echo "Orca $CHANNEL: $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "app=$RUNNER_TEMP/orca/squashfs-root" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      with:
        path: ${{ runner.temp }}/orca
        key: orca-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.version }}

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.resolve.outputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/orca" && cd "$RUNNER_TEMP/orca"
        gh release download "v$VERSION" --repo stablyai/orca --pattern orca-linux.AppImage
        chmod +x orca-linux.AppImage
        ./orca-linux.AppImage --appimage-extract > /dev/null
        rm orca-linux.AppImage
