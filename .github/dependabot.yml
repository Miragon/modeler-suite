version: 2
updates:
  # npm (every workspace resolves from the root lockfile): minor and patch arrive grouped, every
  # major arrives as one PR per dependency so a breaking change gets its own review. The new-modeler
  # template has no lockfile, so Dependabot bumps the exact pins of its package.json files. It shares
  # this entry so that a group PR moves the suite and the template together, and a major moves one
  # dependency in both at once (npm-major below).
  # Dependabot cannot run npm's peer-dependency check in the template (its placeholder names are not
  # valid package names), so it may move a template pin the suite holds back: the template's
  # Node-range drift test fails a pin that runs ahead of every version the suite installs. That is
  # also why a major must not come per directory: the template's PR would fail until the suite's
  # merged.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/plugins/modeler-kit/skills/new-modeler/assets/template"
    schedule:
      interval: "weekly"
    rebase-strategy: "disabled"
    labels:
      - "dependencies"
    # majors arrive as one PR per dependency, which needs headroom above the default of 5
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 3
      semver-major-days: 14
    ignore:
      # The suite's own packages are workspaces, linked and released by release-please; a
      # registry copy of them is never an update. The template's pins of them move with
      # release-please's extra-files.
      - dependency-name: "@miragon/*"
      # @types/vscode must stay <= every extension's engines.vscode (^1.96.0) or `vsce package` fails.
      - dependency-name: "@types/vscode"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # typescript-eslint caps its typescript peer below 6.1, so TypeScript 7 breaks `npm ci`.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # The Release notes check's parser stays on the release-please that release-please-action
      # bundles (team-topologies' parser-version test): bump it by hand, together with the action.
      - dependency-name: "release-please"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # group-by works for version updates only and gives each dependency its own PR across all
      # directories above. A dependency whose directories cannot take the same version still gets a
      # PR per directory. The PR's highest update type is major, so dependabot-automerge.yml leaves
      # it for a human.
      npm-major:
        applies-to: version-updates
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - "major"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # github-actions: majors are mechanical (runner and Node bumps), and every `uses:` is SHA-pinned
  # and CI-gated, so grouping all update types stays low-risk. The composite action under
  # .github/actions pins actions of its own, and so do the new-modeler template's workflows and
  # composite action. Only "/" stands for its .github/workflows: any other directory is read for
  # the YAML files in it, so the template's are listed one by one and move in the suite's PR.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
      - "/plugins/modeler-kit/skills/new-modeler/assets/template/.github/workflows"
      - "/plugins/modeler-kit/skills/new-modeler/assets/template/.github/actions/*"
    schedule:
      interval: "monthly"
    rebase-strategy: "disabled"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 3
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
          - "major"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
