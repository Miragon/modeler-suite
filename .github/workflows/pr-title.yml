name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Squash merges take the PR title as the commit subject (the repository's squash setting
          # is PR_TITLE), so the title is the one Conventional Commit on main and no commit message
          # of the pull request ever lands.
          types: |
            feat
            fix
            chore
            docs
            refactor
            ci
            build
            test
            revert
