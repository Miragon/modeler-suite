name: Dependabot auto-merge

# GitHub merges in the name of whoever enabled auto-merge, and a merge made with GITHUB_TOKEN
# starts no workflow on main: no ci-ok, no CodeQL, no release-please. So auto-merge is enabled with
# the release-please app's token. workflow_run runs this file as it is on main, with the Actions
# secrets, so it must never check out or run code of the pull request.
on:
  workflow_run:
    workflows:
      - "Dependabot auto-merge eligibility"
    types: [completed]

permissions: {}

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create a release-please app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge for a labelled update
        run: |
          gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -qx auto-merge || exit 0
          for i in 1 2 3 4 5; do
            gh pr merge --auto --squash "$PR_NUMBER" && exit 0
            echo "enablePullRequestAutoMerge race (attempt $i) — retrying in 15s…"
            sleep 15
          done
          exit 1
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
