name: Orca smoke

# The Orca plugin of each given modeler in a real Orca (its test:orca): validate, load, render, both
# themes and the plugin's logs, on the newest Orca release and on the oldest that its engines.orca
# accepts. CI calls it with the modelers a change reaches that have a plugin, so a red smoke fails
# ci-ok; smoke-weekly.yml calls it with every such modeler to catch a new Orca release.
on:
  workflow_call:
    inputs:
      modelers:
        description: The modelers with an Orca plugin, a JSON array of folders under modelers/
        required: true
        type: string
  workflow_dispatch:
    inputs:
      modelers:
        description: The modelers with an Orca plugin, a JSON array of folders under modelers/, e.g. ["wardley-maps"]
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  orca-smoke:
    name: ${{ matrix.modeler }} / ${{ matrix.orca }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        modeler: ${{ fromJSON(inputs.modelers) }}
        orca: [latest, minimum]
    env:
      MODELER: ${{ matrix.modeler }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          modeler: ${{ matrix.modeler }}
      - run: npm run build:shared

      - id: orca
        uses: miragon/orca-modelers/.github/actions/setup-orca@7207762e896fe49cc949dc86edb2170ae35035dd # main
        with:
          channel: ${{ matrix.orca }}
          plugin-manifest: modelers/${{ matrix.modeler }}/apps/orca/orca-plugin.json

      - run: xvfb-run -a npm run "$MODELER" test:orca
        env:
          ORCA_APP: ${{ steps.orca.outputs.app }}

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orca-smoke-${{ matrix.modeler }}-${{ matrix.orca }}
          path: modelers/${{ matrix.modeler }}/test-results/orca-smoke/
          retention-days: 7
