name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# A new push to a pull request makes its running checks moot. Pushes to main share one group: a
# running check of main always finishes, and of the pushes waiting behind it only the newest runs,
# so a burst of merges does not queue a full run per commit (each was checked in its pull request).
# A run started by hand has a group of its own and is never replaced.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which modelers, and whether the shared packages, the new-modeler template and the docs site a
  # change reaches (.github/scripts/ci-paths.sh). A path filter on the trigger is no way out: ci-ok has to report
  # on every run.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shared: ${{ steps.paths.outputs.shared }}
      template: ${{ steps.paths.outputs.template }}
      docs: ${{ steps.paths.outputs.docs }}
      modelers: ${{ steps.paths.outputs.modelers }}
      orca-modelers: ${{ steps.paths.outputs.orca-modelers }}
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: paths
        run: .github/scripts/ci-paths.sh affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
      # The browser jobs run in the Playwright image of the root's exact playwright pin (pin-check
      # holds every other Playwright pin to it), and Dependabot does not bump job containers.
      - id: playwright
        run: |
          version=$(jq -r '.devDependencies.playwright' package.json)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The root package.json pins no exact playwright: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run format:check

  pin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Scans every package.json below the root: the shared packages, all workspaces of every
      # modeler and the modeler-kit template.
      - uses: miragon/pin-npm-dependencies@3f7f02fa2454cdd2cdb65df19b081c0d77d301a5 # v1.2.2
      # The browser jobs run in the image of the root's playwright pin, which carries the browsers
      # of that version only.
      - name: Check that every Playwright pin agrees with the root's
        run: |
          root=$(jq -r '.devDependencies.playwright' package.json)
          mismatches=$(git ls-files -z -- 'package.json' '*/package.json' | xargs -0 jq -r --arg root "$root" "$PIN_QUERY")
          if [[ -n "$mismatches" ]]; then
            while read -r mismatch; do echo "::error::$mismatch"; done <<< "$mismatches"
            exit 1
          fi
          echo "Every Playwright pin is $root."
        env:
          PIN_QUERY: >-
            [(.dependencies // {}), (.devDependencies // {})] | add | to_entries[]
            | select(.key == "playwright" or .key == "@playwright/test" or .key == "playwright-core")
            | select(.value != $root)
            | "\(input_filename): \(.key) \(.value), the root pins playwright \($root)"

  # The type check and unit tests of the shared packages and the repository's own tests
  # (test:plugin), which read files of every modeler, the docs and .github: run on every change, so
  # no path rule has to know them.
  shared-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run typecheck:shared
      - run: npm run test:shared
      - run: npm run build:shared
      # The published shape: exports map, dual types, files, which is what consumers resolve.
      - run: npm run publint
      # The extension pack as the release packs it: a walkthrough media path that is gone fails here.
      - run: npm run package -w extensions/modeler-collection

  # The shell's DOM code that needs a real browser (the PNG export of ./export, the palette skin's
  # focus across a rebuild and its armed tools), in Chromium and WebKit.
  shared-test-browser:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run test:browser:shared

  shared-e2e:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Browsers and their system libraries come with the image, so no run installs them.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
    env:
      SHARD: ${{ matrix.shard }}
      # The describe in packages/shell/e2e/saboteurs.spec.ts whose saboteurs each run the whole kit,
      # about a minute apiece. A shard is a contiguous slice of the test list, so sharded with the
      # rest they all fell into one shard and filled its 20 minutes; sharded on their own, every
      # shard runs a quarter of them.
      KIT_SABOTEURS: that break one rule and fail only its case
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The shell's conformance kit against its demo page (ide, web, embedded hosts) plus saboteurs.
      - id: others
        run: npm run test:e2e -w @miragon/modeler-shell -- --shard="$SHARD/4" --grep-invert="$KIT_SABOTEURS"
      # Its own output folder: Playwright empties its output folder when it starts, which would
      # delete the traces of the step above.
      - if: success() || steps.others.outcome == 'failure'
        run: >-
          npm run test:e2e -w @miragon/modeler-shell -- --shard="$SHARD/4" --grep="$KIT_SABOTEURS"
          --output=test-results/saboteurs
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-shell-${{ matrix.shard }}
          path: packages/shell/test-results/
          retention-days: 7

  # The per-modeler jobs run once for each modeler the change reaches. Every one builds the shared
  # packages first: the modelers resolve @miragon/modeler-api and @miragon/modeler-shell from their
  # dist, as their published consumers do.
  modeler-check:
    needs: changes
    if: needs.changes.outputs.modelers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        modeler: ${{ fromJSON(needs.changes.outputs.modelers) }}
    env:
      MODELER: ${{ matrix.modeler }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          modeler: ${{ matrix.modeler }}
      - run: npm run build:shared
      - run: npm run "$MODELER" lint
      - run: npm run "$MODELER" depcruise
      - run: npm run "$MODELER" build
      - run: npm run "$MODELER" test
      # The production web app: e2e runs the dev server, so only this build shows what Netlify ships.
      - run: npm run "$MODELER" build:webapp
      - run: npm run check:build -w "modelers/$MODELER/apps/webapp"
      # The VSIX as the release packs it (vscode:prepublish, .vscodeignore).
      - run: npm run "$MODELER" package:vscode

  modeler-test-browser:
    needs: changes
    if: needs.changes.outputs.modelers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        modeler: ${{ fromJSON(needs.changes.outputs.modelers) }}
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
    env:
      MODELER: ${{ matrix.modeler }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          modeler: ${{ matrix.modeler }}
      - run: npm run build:shared
      - run: npm run "$MODELER" build
      - run: npm run "$MODELER" test:browser

  modeler-e2e:
    needs: changes
    if: needs.changes.outputs.modelers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        modeler: ${{ fromJSON(needs.changes.outputs.modelers) }}
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
    env:
      MODELER: ${{ matrix.modeler }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          modeler: ${{ matrix.modeler }}
      - run: npm run build:shared
      # Some specs import web-app and extension sources in Node, which resolve the modeler's
      # packages through their built dist.
      - run: npm run "$MODELER" build
      - run: npm run "$MODELER" test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.modeler }}
          path: modelers/${{ matrix.modeler }}/e2e/playwright-report/
          retention-days: 7

  # A modeler created from the new-modeler template (plugins/modeler-kit), on the shared packages of
  # this checkout packed as they are published, with that modeler's own checks. The drift test only
  # type-checks the template; this is the one place that installs, builds and runs it, so a kit case
  # the template's harness fails or a bundling problem shows here and not when the next modeler
  # starts (.github/scripts/template-instance.mjs).
  template:
    needs: changes
    if: needs.changes.outputs.template == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run build:shared
      - id: instance
        run: |
          node .github/scripts/template-instance.mjs "$INSTANCE"
          echo "directory=$INSTANCE" >> "$GITHUB_OUTPUT"
        env:
          INSTANCE: ${{ runner.temp }}/capability-map-modeler
      - run: npm run lint
        working-directory: ${{ steps.instance.outputs.directory }}
      - run: npm run depcruise
        working-directory: ${{ steps.instance.outputs.directory }}
      - run: npm run build
        working-directory: ${{ steps.instance.outputs.directory }}
      - run: npm test
        working-directory: ${{ steps.instance.outputs.directory }}
      - run: npm run test:browser
        working-directory: ${{ steps.instance.outputs.directory }}
      - run: npm run test:e2e
        working-directory: ${{ steps.instance.outputs.directory }}
      - run: npm run build:webapp
        working-directory: ${{ steps.instance.outputs.directory }}
      - run: npm run check:build -w apps/webapp
        working-directory: ${{ steps.instance.outputs.directory }}
      - run: npm run build:vscode
        working-directory: ${{ steps.instance.outputs.directory }}
      # The VSIX as the template's release packs it (vscode:prepublish, .vscodeignore).
      - run: npm run package -w apps/vscode
        working-directory: ${{ steps.instance.outputs.directory }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-template
          path: ${{ steps.instance.outputs.directory }}/e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # The same instance's packaged extension in a real VS Code, as the template's own CI smokes it
  # before a repository exists. Not in the template job: VS Code needs the runner image's X server
  # and GTK libraries, which the Playwright image lacks.
  template-vscode-smoke:
    needs: changes
    if: needs.changes.outputs.template == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        vscode: [stable, minimum]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run build:shared
      - id: instance
        run: |
          node .github/scripts/template-instance.mjs "$INSTANCE"
          echo "directory=$INSTANCE" >> "$GITHUB_OUTPUT"
        env:
          INSTANCE: ${{ runner.temp }}/capability-map-modeler
      - id: vscode
        uses: ./.github/actions/vscode
        with:
          channel: ${{ matrix.vscode }}
          extension-manifest: ${{ steps.instance.outputs.directory }}/apps/vscode/package.json
      # The runner is thrown away anyway, so the run keeps VS Code's profile in RUNNER_TEMP, for its
      # logs when it fails.
      - run: xvfb-run -a npm run test:vscode
        working-directory: ${{ steps.instance.outputs.directory }}
        env:
          VSCODE_VERSION: ${{ steps.vscode.outputs.version }}
          VSCODE_SMOKE_KEEP: "1"
          TMPDIR: ${{ runner.temp }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-vscode-smoke-${{ matrix.vscode }}
          path: |
            ${{ steps.instance.outputs.directory }}/test-results/vscode-smoke/
            ${{ runner.temp }}/modeler-shell-vscode-*/user-data/logs/
          if-no-files-found: ignore
          retention-days: 7

  # The docs site (docs/, its own npm project) as docs.yml deploys it from main: the vendored Miragon
  # docs kit unchanged, and a build, which fails on a dead link.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history: VitePress reads "last updated" from git.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: node .vitepress/miragon/check.mjs
        working-directory: docs
      - run: npm run build
        working-directory: docs
        env:
          DOCS_BASE: /modeler-suite/

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Every reached modeler's packaged extension in a real VS Code.
  vscode-smoke:
    needs: changes
    if: needs.changes.outputs.modelers != '[]'
    uses: ./.github/workflows/vscode-smoke.yml
    with:
      modelers: ${{ needs.changes.outputs.modelers }}

  # Every reached modeler's Orca plugin in a real Orca.
  orca-smoke:
    needs: changes
    if: needs.changes.outputs.orca-modelers != '[]'
    uses: ./.github/workflows/orca-smoke.yml
    with:
      modelers: ${{ needs.changes.outputs.orca-modelers }}

  # The merge gate, required by the ruleset next to validate-pr-title (.github/scripts/ci-gate.sh):
  # it needs every other job of this workflow and fails on any failed or cancelled one.
  ci-ok:
    if: always()
    needs:
      - changes
      - format-check
      - pin-check
      - shared-test
      - shared-test-browser
      - shared-e2e
      - modeler-check
      - modeler-test-browser
      - modeler-e2e
      - template
      - template-vscode-smoke
      - docs
      - dependency-review
      - vscode-smoke
      - orca-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every job to succeed or to be skipped
        run: .github/scripts/ci-gate.sh
        env:
          NEEDS: ${{ toJSON(needs) }}
          WORKFLOW_FILE: .github/workflows/ci.yml
