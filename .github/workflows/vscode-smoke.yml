name: VS Code smoke

# One modeler's packaged extension in a real VS Code (its test:vscode), on the newest stable VS Code
# and on the oldest that its engines.vscode accepts. CI calls it once per modeler, so a red smoke
# fails ci-ok, the merge gate; vscode-smoke-weekly.yml calls it to catch a new VS Code release, and
# alerts when that run fails.
on:
  workflow_call:
    inputs:
      modeler:
        description: The modeler, a folder under modelers/
        required: true
        type: string
  workflow_dispatch:
    inputs:
      modeler:
        description: The modeler, a folder under modelers/
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # The smoke costs a VS Code download and two runs, wasted on a change that cannot reach the VSIX.
  # A path filter on the trigger is no way out: CI has to report this workflow on every run.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: decide
        name: Decide whether a path the packaged extension depends on changed
        run: .github/scripts/ci-paths.sh vscode-smoke "$MODELER"
        env:
          MODELER: ${{ inputs.modeler }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}

  vscode-smoke:
    name: ${{ inputs.modeler }} / ${{ matrix.vscode }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # Pinned rather than ubuntu-latest: VS Code needs the image's X server and GTK libraries, and a
    # label migration should not break this job unnoticed.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        vscode: [stable, minimum]
    env:
      MODELER: ${{ inputs.modeler }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          modeler: ${{ inputs.modeler }}
      # The VSIX bundles the shared packages from their build, and the smoke's driver comes from
      # @miragon/modeler-shell/testing.
      - run: npm run build:shared

      # The cache key needs the version before the test resolves it; the test then runs exactly it.
      # The minimum comes from engines.vscode at run time, so raising the floor moves the smoke along.
      # The stable list is the one the driver checks a version against (released=true), so a build
      # still rolling out is never picked.
      - id: vscode
        name: Resolve the VS Code version and its cache folder
        env:
          CHANNEL: ${{ matrix.vscode }}
        run: |
          if [[ "$CHANNEL" == minimum ]]; then
            version=$(node -p "require('semver').minVersion(require('./modelers/$MODELER/apps/vscode/package.json').engines.vscode).version")
          else
            version=$(curl -fsSL --retry 3 'https://update.code.visualstudio.com/api/releases/stable?released=true' | jq -r '.[0]')
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No VS Code version for $CHANNEL: '$version'"
            exit 1
          fi
          echo "VS Code $CHANNEL: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "cache=${XDG_CACHE_HOME:-$HOME/.cache}/miragon-modeler-shell/vscode-test" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vscode.outputs.cache }}
          key: vscode-${{ runner.os }}-${{ runner.arch }}-${{ steps.vscode.outputs.version }}

      # VS Code needs an X server; -a picks a free display number. Not test:vscode:docker: the runner
      # is Linux with VS Code's libraries already, and the cache above keeps VS Code on the runner,
      # where a Docker volume would start empty on every run. The runner is thrown away anyway, so the
      # run keeps VS Code's profile in RUNNER_TEMP, for its logs when it fails.
      - run: xvfb-run -a npm run "$MODELER" test:vscode
        env:
          VSCODE_VERSION: ${{ steps.vscode.outputs.version }}
          VSCODE_SMOKE_KEEP: "1"
          TMPDIR: ${{ runner.temp }}

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-smoke-${{ inputs.modeler }}-${{ matrix.vscode }}
          path: modelers/${{ inputs.modeler }}/test-results/vscode-smoke/
          retention-days: 7

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-smoke-logs-${{ inputs.modeler }}-${{ matrix.vscode }}
          path: ${{ runner.temp }}/modeler-shell-vscode-*/user-data/logs/
          if-no-files-found: ignore
          retention-days: 7

  # A skipped smoke ends in a job that succeeds, so the caller sees success, never a skip that
  # ci-ok would have to tell apart from a skip after a failure.
  skipped:
    name: ${{ inputs.modeler }} / skipped
    needs: changes
    if: needs.changes.outputs.run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "::notice title=VS Code smoke skipped::No path the $MODELER extension depends on changed."
        env:
          MODELER: ${{ inputs.modeler }}
