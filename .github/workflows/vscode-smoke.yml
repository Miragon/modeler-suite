name: VS Code smoke

# The packaged extension of each given modeler in a real VS Code (its test:vscode), on the newest
# stable VS Code and on the oldest that its engines.vscode accepts. CI calls it with the modelers a
# change reaches, so a red smoke fails ci-ok, the merge gate; vscode-smoke-weekly.yml calls it with
# every modeler to catch a new VS Code release, and alerts when that run fails.
on:
  workflow_call:
    inputs:
      modelers:
        description: The modelers, a JSON array of folders under modelers/
        required: true
        type: string
  workflow_dispatch:
    inputs:
      modelers:
        description: The modelers, a JSON array of folders under modelers/, e.g. ["c4"]
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  vscode-smoke:
    name: ${{ matrix.modeler }} / ${{ matrix.vscode }}
    # Pinned rather than ubuntu-latest: VS Code needs the image's X server and GTK libraries, and a
    # label migration should not break this job unnoticed.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        modeler: ${{ fromJSON(inputs.modelers) }}
        vscode: [stable, minimum]
    env:
      MODELER: ${{ matrix.modeler }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          modeler: ${{ matrix.modeler }}
      # The VSIX bundles the shared packages from their build, and the smoke's driver comes from
      # @miragon/modeler-shell/testing.
      - run: npm run build:shared

      # The cache key needs the version before the test resolves it; the test then runs exactly it.
      # The minimum comes from engines.vscode at run time, so raising the floor moves the smoke along.
      # The stable list is the one the driver checks a version against (released=true), so a build
      # still rolling out is never picked.
      - id: vscode
        name: Resolve the VS Code version and its cache folder
        env:
          CHANNEL: ${{ matrix.vscode }}
        run: |
          if [[ "$CHANNEL" == minimum ]]; then
            version=$(node -p "require('semver').minVersion(require('./modelers/$MODELER/apps/vscode/package.json').engines.vscode).version")
          else
            version=$(curl -fsSL --retry 3 'https://update.code.visualstudio.com/api/releases/stable?released=true' | jq -r '.[0]')
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No VS Code version for $CHANNEL: '$version'"
            exit 1
          fi
          echo "VS Code $CHANNEL: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "cache=${XDG_CACHE_HOME:-$HOME/.cache}/miragon-modeler-shell/vscode-test" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vscode.outputs.cache }}
          key: vscode-${{ runner.os }}-${{ runner.arch }}-${{ steps.vscode.outputs.version }}

      # VS Code needs an X server; -a picks a free display number. Not test:vscode:docker: the runner
      # is Linux with VS Code's libraries already, and the cache above keeps VS Code on the runner,
      # where a Docker volume would start empty on every run. The runner is thrown away anyway, so the
      # run keeps VS Code's profile in RUNNER_TEMP, for its logs when it fails.
      - run: xvfb-run -a npm run "$MODELER" test:vscode
        env:
          VSCODE_VERSION: ${{ steps.vscode.outputs.version }}
          VSCODE_SMOKE_KEEP: "1"
          TMPDIR: ${{ runner.temp }}

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-smoke-${{ matrix.modeler }}-${{ matrix.vscode }}
          path: modelers/${{ matrix.modeler }}/test-results/vscode-smoke/
          retention-days: 7

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-smoke-logs-${{ matrix.modeler }}-${{ matrix.vscode }}
          path: ${{ runner.temp }}/modeler-shell-vscode-*/user-data/logs/
          if-no-files-found: ignore
          retention-days: 7
