# Enables auto-merge for the updates dependabot-automerge-eligibility.yml labelled, with the
# release-please app's token: a merge made with GITHUB_TOKEN starts no workflow on main. workflow_run
# runs this file from main with the Actions secrets, so it never runs code of the pull request.
name: Dependabot auto-merge

on:
  workflow_run:
    workflows:
      - 'Dependabot auto-merge eligibility'
    types: [completed]

permissions: {}

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create a release-please app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge for a labelled update
        run: |
          gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -qx auto-merge || exit 0
          gh pr merge --auto --squash "$PR_NUMBER"
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
