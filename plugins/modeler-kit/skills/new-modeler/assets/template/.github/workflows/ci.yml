name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run lint

  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run format:check
      - name: Check the design-system copies against .miragon/brand-assets.sha256
        run: sha256sum -c .miragon/brand-assets.sha256

  depcruise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run depcruise

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run build
      - run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run build
      # The production web app: e2e runs the dev server, so only this build shows what is deployed.
      - run: npm run build:webapp
      - run: npm run check:build -w apps/webapp
      - run: npm run build:vscode

  playwright-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Exact-pinned (save-exact), so the manifest value is the resolved version.
      - id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"

  test-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, build, playwright-version]
    # The image ships Chromium and its system libraries for exactly this Playwright version.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.value }}-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run build
      # the renderer in Chromium, with the @miragon/modeler-api conformance kit
      - run: npm run test:browser

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, build, playwright-version]
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.value }}-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # webapp + vscode-webview, each with the @miragon/modeler-shell conformance kit
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # The built extension in a real VS Code on the newest stable release and the engines floor.
  vscode-smoke:
    uses: ./.github/workflows/vscode-smoke.yml

  pin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: miragon/pin-npm-dependencies@3f7f02fa2454cdd2cdb65df19b081c0d77d301a5 # v1.2.2

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # The merge gate. A required check that is skipped counts as passed, so this job, not the single
  # ones, is the check for the ruleset to require. Every other job of this workflow belongs in its
  # needs: a job skipped because a job it needs failed comes with that failure, so ci-ok fails on a
  # failed or cancelled job and passes a skip.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - lint
      - format-check
      - depcruise
      - test
      - build
      - playwright-version
      - test-browser
      - e2e
      - vscode-smoke
      - pin-check
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed or to be skipped
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          results=$(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS")
          if [[ -z "$results" ]]; then
            echo "::error::ci-ok needs no job"
            exit 1
          fi
          failed=0
          while read -r job result; do
            case "$result" in
              success | skipped) echo "$job: $result" ;;
              *)
                echo "::error::$job: $result"
                failed=1
                ;;
            esac
          done <<< "$results"
          exit "$failed"
