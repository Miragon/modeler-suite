name: VS Code smoke

# The built extension in a real VS Code (apps/vscode/test-smoke, `npm run test:vscode-smoke`), on
# the newest stable VS Code and on the oldest that engines.vscode accepts. CI calls it as its job
# vscode-smoke, so a red smoke fails ci-ok, the merge gate; vscode-smoke-weekly.yml calls it to
# catch a new VS Code release, and it alerts when that run fails.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vscode-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        vscode: [stable, minimum]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # The cache key needs the version before the test resolves it; the test then runs exactly it.
      # The minimum comes from engines.vscode at run time, so raising the floor moves the smoke along.
      # The stable list is the one the driver checks a version against (released=true), so a build
      # still rolling out is never picked.
      - id: vscode
        name: Resolve the VS Code version and its cache folder
        shell: bash
        env:
          CHANNEL: ${{ matrix.vscode }}
        run: |
          if [[ "$CHANNEL" == minimum ]]; then
            version=$(node -p "require('./apps/vscode/package.json').engines.vscode.match(/\d+\.\d+\.\d+/)?.[0]")
          else
            version=$(curl -fsSL --retry 3 'https://update.code.visualstudio.com/api/releases/stable?released=true' | jq -r '.[0]')
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No VS Code version for $CHANNEL: '$version'"
            exit 1
          fi
          echo "VS Code $CHANNEL: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "cache=${XDG_CACHE_HOME:-$HOME/.cache}/miragon-modeler-shell/vscode-test" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vscode.outputs.cache }}
          key: vscode-${{ runner.os }}-${{ runner.arch }}-${{ steps.vscode.outputs.version }}

      # The smoke test imports the DSL through node_modules, which resolves to its dist.
      - run: npm run build
      - run: npm run build:vscode
      # VS Code needs an X server; -a picks a free display number. The runner is thrown away anyway,
      # so the run keeps VS Code's profile in RUNNER_TEMP, for its logs when it fails.
      - run: xvfb-run -a npm run test:vscode-smoke
        env:
          VSCODE_VERSION: ${{ steps.vscode.outputs.version }}
          VSCODE_SMOKE_KEEP: '1'
          TMPDIR: ${{ runner.temp }}

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-smoke-${{ matrix.vscode }}
          path: test-results/vscode-smoke/
          retention-days: 7

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-smoke-logs-${{ matrix.vscode }}
          path: ${{ runner.temp }}/modeler-shell-vscode-*/user-data/logs/
          if-no-files-found: ignore
          retention-days: 7
