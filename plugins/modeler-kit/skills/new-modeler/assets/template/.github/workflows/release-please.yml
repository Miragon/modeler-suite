name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, pack and smoke-test without releasing'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

# Trusted publishing (OIDC, no token) is bound to this file name and to the environment of the
# publish job: `npm` on npmjs.com, `vscode-marketplace` for the publisher's Trusted Publishing policy
# on the VS Code Marketplace and for the extension's trusted publisher on Open VSX. Renaming the file
# or an environment breaks publishing until those are updated.
#
# Every target takes the same steps: build and check without an environment, then one approval,
# then publish. Each publish job needs the build, so the environments ask for approval at the same
# moment.

jobs:
  release-please:
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # one output per component: release-please reports each path as `<path>--release_created`,
    # so a release of one package never publishes another
    outputs:
      schema_model_released: ${{ steps.release_please.outputs['packages/schema-model--release_created'] }}
      dsl_released: ${{ steps.release_please.outputs['packages/dsl--release_created'] }}
      renderer_released: ${{ steps.release_please.outputs['packages/renderer--release_created'] }}
      vscode_released: ${{ steps.release_please.outputs['apps/vscode--release_created'] }}
    steps:
      # an app token, so the release PR runs CI (pushes with GITHUB_TOKEN trigger no workflows)
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - id: release_please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The VSIX, packed and smoke-tested once, for both marketplaces; in a dry run also the npm packs.
  build:
    needs: release-please
    if: ${{ !cancelled() && (inputs.dry_run || needs.release-please.outputs.vscode_released == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node-version: 24
      # The smoke test imports the DSL through node_modules, which resolves to its dist.
      - run: npm run build
      - if: inputs.dry_run
        run: npm publish -w packages/schema-model -w packages/dsl -w packages/renderer --dry-run
      - run: npm run build:vscode
      - name: Package extension
        working-directory: apps/vscode
        run: npx vsce package --no-dependencies -o __REPO__.vsix
      # The VSIX the publish jobs upload, in a real VS Code: a package that does not activate never
      # ships. The test takes an extension folder, so it gets the VSIX's files unpacked, not the
      # folder the VSIX was packed from.
      - name: Smoke-test the VSIX in VS Code
        run: |
          unzip -q apps/vscode/__REPO__.vsix 'extension/*' -d "$RUNNER_TEMP/vsix"
          xvfb-run -a npm run test:vscode-smoke
        env:
          VSCODE_VERSION: stable
          VSCODE_SMOKE_EXTENSION: ${{ runner.temp }}/vsix/extension
          VSCODE_SMOKE_KEEP: '1'
          TMPDIR: ${{ runner.temp }}
      # The release is already tagged when this smoke fails, so its screenshots and VS Code's logs are
      # all there is to tell why.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-smoke-release
          path: |
            test-results/vscode-smoke/
            ${{ runner.temp }}/modeler-shell-vscode-*/user-data/logs/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: apps/vscode/__REPO__.vsix
          if-no-files-found: error
          retention-days: 7

  publish-npm-schema-model:
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result != 'failure' && needs.release-please.outputs.schema_model_released == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package: schema-model

  publish-npm-dsl:
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result != 'failure' && needs.release-please.outputs.dsl_released == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package: dsl

  publish-npm-renderer:
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result != 'failure' && needs.release-please.outputs.renderer_released == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package: renderer

  # --skip-duplicate lets a re-run pass a marketplace that already has the version.
  publish-vscode:
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.release-please.outputs.vscode_released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        marketplace: [vscode-marketplace, open-vsx]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: apps/vscode
      - if: matrix.marketplace == 'vscode-marketplace'
        working-directory: apps/vscode
        run: npx vsce publish --packagePath __REPO__.vsix --skip-duplicate --oidc
      - if: matrix.marketplace == 'open-vsx'
        working-directory: apps/vscode
        run: npx ovsx publish --packagePath __REPO__.vsix --skip-duplicate --trusted-publishing
