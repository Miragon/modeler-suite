name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate packaging and publishing without releasing'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # one output per component: release-please reports each path as `<path>--release_created`,
    # so a release of one package never publishes another
    outputs:
      schema_model_released: ${{ steps.release_please.outputs['packages/schema-model--release_created'] }}
      dsl_released: ${{ steps.release_please.outputs['packages/dsl--release_created'] }}
      renderer_released: ${{ steps.release_please.outputs['packages/renderer--release_created'] }}
      vscode_released: ${{ steps.release_please.outputs['apps/vscode--release_created'] }}
    steps:
      # an app token, so the release PR runs CI (pushes with GITHUB_TOKEN trigger no workflows)
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - id: release_please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm-schema-model:
    needs: release-please
    if: needs.release-please.outputs.schema_model_released == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package: schema-model

  publish-npm-dsl:
    needs: release-please
    if: needs.release-please.outputs.dsl_released == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package: dsl

  publish-npm-renderer:
    needs: release-please
    if: needs.release-please.outputs.renderer_released == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package: renderer

  publish-vscode:
    needs: release-please
    if: needs.release-please.outputs.vscode_released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: vscode-marketplace
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node-version: 24
      # The smoke test imports the DSL through node_modules, which resolves to its dist.
      - run: npm run build
      - run: npm run build:vscode
      - name: Package extension
        working-directory: apps/vscode
        run: npx vsce package --no-dependencies -o __REPO__.vsix
      # The VSIX this job uploads, in a real VS Code: a package that does not activate never ships.
      # The test takes an extension folder, so it gets the VSIX's files unpacked, not the folder
      # the VSIX was packed from.
      - name: Smoke-test the VSIX in VS Code
        run: |
          unzip -q apps/vscode/__REPO__.vsix 'extension/*' -d "$RUNNER_TEMP/vsix"
          xvfb-run -a npm run test:vscode-smoke
        env:
          VSCODE_VERSION: stable
          VSCODE_SMOKE_EXTENSION: ${{ runner.temp }}/vsix/extension
          VSCODE_SMOKE_KEEP: '1'
          TMPDIR: ${{ runner.temp }}
      # The release is already tagged when this smoke fails, so its screenshots and VS Code's logs are
      # all there is to tell why.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-smoke-marketplace
          path: |
            test-results/vscode-smoke/
            ${{ runner.temp }}/modeler-shell-vscode-*/user-data/logs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish to VS Code Marketplace
        working-directory: apps/vscode
        run: npx vsce publish --packagePath __REPO__.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PUBLISH }}

  publish-open-vsx:
    needs: release-please
    if: needs.release-please.outputs.vscode_released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: vscode-marketplace
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node-version: 24
      - run: npm run build
      - run: npm run build:vscode
      - name: Package extension
        working-directory: apps/vscode
        run: npx vsce package --no-dependencies -o __REPO__.vsix
      # The VSIX this job uploads, in a real VS Code: a package that does not activate never ships.
      - name: Smoke-test the VSIX in VS Code
        run: |
          unzip -q apps/vscode/__REPO__.vsix 'extension/*' -d "$RUNNER_TEMP/vsix"
          xvfb-run -a npm run test:vscode-smoke
        env:
          VSCODE_VERSION: stable
          VSCODE_SMOKE_EXTENSION: ${{ runner.temp }}/vsix/extension
          VSCODE_SMOKE_KEEP: '1'
          TMPDIR: ${{ runner.temp }}
      # The release is already tagged when this smoke fails, so its screenshots and VS Code's logs are
      # all there is to tell why.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-smoke-open-vsx
          path: |
            test-results/vscode-smoke/
            ${{ runner.temp }}/modeler-shell-vscode-*/user-data/logs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish to Open VSX Marketplace
        working-directory: apps/vscode
        run: npx ovsx publish --packagePath __REPO__.vsix --pat "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PUBLISH }}

  dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node-version: 24
      - run: npm run build
      - run: npm publish -w packages/schema-model -w packages/dsl -w packages/renderer --dry-run
      - run: npm run build:vscode
      - name: Package extension
        working-directory: apps/vscode
        run: npx vsce package --no-dependencies -o __REPO__.vsix
      # The publish jobs' smoke, so a dry run shows it passes before a release depends on it.
      - name: Smoke-test the VSIX in VS Code
        run: |
          unzip -q apps/vscode/__REPO__.vsix 'extension/*' -d "$RUNNER_TEMP/vsix"
          xvfb-run -a npm run test:vscode-smoke
        env:
          VSCODE_VERSION: stable
          VSCODE_SMOKE_EXTENSION: ${{ runner.temp }}/vsix/extension
          VSCODE_SMOKE_KEEP: '1'
          TMPDIR: ${{ runner.temp }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-smoke-dry-run
          path: |
            test-results/vscode-smoke/
            ${{ runner.temp }}/modeler-shell-vscode-*/user-data/logs/
          if-no-files-found: ignore
          retention-days: 7
